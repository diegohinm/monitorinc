            - article [ref=f1e108]:
              - generic [ref=f1e109]: "01"
              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f1e110]
              - paragraph [ref=f1e111]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
            - article [ref=f1e112]:
              - generic [ref=f1e113]: "02"
              - heading "Alarmas de intrusión" [level=3] [ref=f1e114]
              - paragraph [ref=f1e115]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
            - article [ref=f1e116]:
              - generic [ref=f1e117]: "03"
              - heading "Seguridad perimetral" [level=3] [ref=f1e118]
              - paragraph [ref=f1e119]: Las cercas eléctricas y concertinas con alarmas sonoras y control de usuarios son soluciones de alto nivel de protección perimetral de las propiedades como fincas, conjuntos cerrados e instituciones educativas.
            - article [ref=f1e120]:
