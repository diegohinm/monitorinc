              - heading "Detección de incendios y alarmas de evacuación" [level=3] [ref=f1e128]
              - paragraph [ref=f1e129]: Diseñamos e implementamos sistemas de detección automática de incendios y audio evacuación para una reacción inmediata. Contamos con equipos profesionales regidos por las normas y requerimientos europeos.
