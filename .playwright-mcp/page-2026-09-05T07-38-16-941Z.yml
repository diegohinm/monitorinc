            - generic [ref=f1e105]: 01 — Qué hacemos
            - heading [level=2] [ref=f1e106]:
              - text: Seguridad, acceso y monitoreo desde un solo
              - emphasis [ref=f1e107]: integrador.
          - paragraph [ref=f1e108]: Distribuimos e integramos equipos de seguridad electrónica y de comunicación. Contamos con profesionales expertos en ingeniería electrónica y de telecomunicaciones para diseñar e implementar proyectos de alto nivel que requieran equipos y comunicaciones especiales en ciudades, pueblos, corregimientos e incluso en ambientes hostiles y de difícil acceso.
