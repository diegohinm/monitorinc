            - article [ref=f1e114]:
              - generic [ref=f1e115]: "01"
              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f1e116]
              - paragraph [ref=f1e117]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
            - article [ref=f1e118]:
              - generic [ref=f1e119]: "02"
              - heading "Alarmas de intrusión" [level=3] [ref=f1e120]
              - paragraph [ref=f1e121]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
            - article [ref=f1e122]:
              - generic [ref=f1e123]: "03"
              - heading "Seguridad perimetral" [level=3] [ref=f1e124]
              - paragraph [ref=f1e125]: Las cercas eléctricas y concertinas con alarmas sonoras y control de usuarios son soluciones de alto nivel de protección perimetral de las propiedades como fincas, conjuntos cerrados e instituciones educativas.
            - article [ref=f1e126]:
