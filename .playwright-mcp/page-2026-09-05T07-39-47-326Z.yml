            - article [ref=f3e108]:
              - generic [ref=f3e109]: "01"
              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f3e110]
              - paragraph [ref=f3e111]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
            - article [ref=f3e112]:
              - generic [ref=f3e113]: "02"
              - heading "Alarmas de intrusión" [level=3] [ref=f3e114]
              - paragraph [ref=f3e115]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
            - article [ref=f3e116]:
