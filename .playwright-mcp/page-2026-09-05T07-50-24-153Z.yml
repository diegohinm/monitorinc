              - heading "Seguridad perimetral" [level=3] [ref=f4e118]
              - paragraph [ref=f4e119]: Las cercas eléctricas y concertinas con alarmas sonoras y control de usuarios son soluciones de alto nivel de protección perimetral de las propiedades como fincas, conjuntos cerrados e instituciones educativas.
            - article [ref=f4e120]:
