              - heading "Detección de incendios y alarmas de evacuación" [level=3] [ref=f4e122]
              - paragraph [ref=f4e123]: Diseñamos e implementamos sistemas de detección automática de incendios y audio evacuación para una reacción inmediata. Contamos con equipos profesionales regidos por las normas y requerimientos europeos.
