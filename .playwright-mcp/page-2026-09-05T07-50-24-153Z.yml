            - article [ref=f4e108]:
              - generic [ref=f4e109]: "01"
              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f4e110]
              - paragraph [ref=f4e111]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
            - article [ref=f4e112]:
              - generic [ref=f4e113]: "02"
              - heading "Alarmas de intrusión" [level=3] [ref=f4e114]
              - paragraph [ref=f4e115]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
            - article [ref=f4e116]:
