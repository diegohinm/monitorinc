              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f2e110]
              - paragraph [ref=f2e111]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
