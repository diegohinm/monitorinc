              - heading "Alarmas de intrusión" [level=3] [ref=f2e114]
              - paragraph [ref=f2e115]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
