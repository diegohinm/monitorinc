            - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f1e109]
            - paragraph [ref=f1e110]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
          - article [ref=f1e111]:
            - generic [ref=f1e112]: "02"
            - heading "Alarmas de intrusión" [level=3] [ref=f1e113]
            - paragraph [ref=f1e114]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
