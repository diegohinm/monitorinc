              - heading "Control de acceso" [level=3] [ref=f3e136]
              - paragraph [ref=f3e137]: Regulación y control para entrada y salida de personas y vehículos en diferentes instalaciones. Contamos con equipos que soportan desde tarjetas RFID y código de barras, hasta huellas dactilares y detección de rostros.
            - article [ref=f3e138]:
