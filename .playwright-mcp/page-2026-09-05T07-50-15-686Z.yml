            - article [ref=f3e114]:
              - generic [ref=f3e115]: "01"
              - heading "Circuito cerrado de televisión (CCTV) y grabación" [level=3] [ref=f3e116]
              - paragraph [ref=f3e117]: Ofrecemos cámaras de seguridad y grabadores de video con tecnología IP y análoga, óptimos para combatir la inseguridad en cualquier ambiente, pérdida de elementos, control de personal y de procesos.
            - article [ref=f3e118]:
              - generic [ref=f3e119]: "02"
              - heading "Alarmas de intrusión" [level=3] [ref=f3e120]
              - paragraph [ref=f3e121]: Contamos con sistemas de alarmas alámbricas e inalámbricas que se adaptan a cualquier tipo de infraestructura para interior o exterior y con las últimas tecnologías de monitoreo remoto desde su celular.
            - article [ref=f3e122]:
              - generic [ref=f3e123]: "03"
              - heading "Seguridad perimetral" [level=3] [ref=f3e124]
              - paragraph [ref=f3e125]: Las cercas eléctricas y concertinas con alarmas sonoras y control de usuarios son soluciones de alto nivel de protección perimetral de las propiedades como fincas, conjuntos cerrados e instituciones educativas.
            - article [ref=f3e126]:
              - generic [ref=f3e127]: "04"
              - heading "Detección de incendios y alarmas de evacuación" [level=3] [ref=f3e128]
              - paragraph [ref=f3e129]: Diseñamos e implementamos sistemas de detección automática de incendios y audio evacuación para una reacción inmediata. Contamos con equipos profesionales regidos por las normas y requerimientos europeos.
