<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48">
  <!--
    Bosch logo — styled to match .m-marquee__item:
    font-family: Space Grotesk (with system fallbacks)
    font-weight: 700
    letter-spacing: 0.12em
    color: rgba(235, 242, 255, 0.72)
  -->
  <g fill="rgba(235,242,255,0.72)">
    <!-- ── Emblem: circle + armature symbol ─────────────── -->
    <circle cx="24" cy="24" r="17" fill="none" stroke="rgba(235,242,255,0.72)" stroke-width="2.2"/>
    <!-- Cross / armature body -->
    <path d="M21 12h6v8.5h7v7h-7v8.5h-6v-8.5h-7v-7h7z"/>
    <!-- Top serif -->
    <rect x="18.5" y="9.5" width="11" height="2.5" rx="0.4"/>
    <!-- Bottom serif -->
    <rect x="18.5" y="36" width="11" height="2.5" rx="0.4"/>

    <!-- ── BOSCH wordmark ──────────────────────────────── -->
    <text x="52" y="33"
      font-family="'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
      font-size="26"
      font-weight="700"
      letter-spacing="0.12em">BOSCH</text>
  </g>
</svg>
